[project]
name = "tube-reliability"
version = "0.1.0"
description = "London Underground reliability tracker"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "alembic",
    "psycopg[binary]",
    "httpx",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[uv.tool]
package = false